name: release

# 推送 v* 标签(如 v0.1.0)时自动构建各平台开箱即用包并发布到 GitHub Release。
# 在网页手动发布 Release 同样会触发构建并上传二进制。
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest # Apple Silicon
          - os: macos-13 # Intel
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建前端
        working-directory: web
        run: npm ci && npm run build

      - uses: astral-sh/setup-uv@v5

      - name: 构建 release 包
        run: uv sync && uv run python pyinstaller/build_release.py --skip-frontend

      - uses: softprops/action-gh-release@v2
        with:
          files: dist_release/bilibili-music-player-*.*
